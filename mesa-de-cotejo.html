<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mesa de Cotejo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --paper:#f4f6f6;
  --surface:#ffffff;
  --surface-2:#eef1f2;
  --ink:#14181b;
  --muted:#586870;
  --line:#dce2e4;
  --line-strong:#c3cdd1;
  --accent:#1b5f7a;
  --accent-ink:#124559;
  --accent-wash:#e7f0f4;
  --ok-bg:#c6efce;
  --ok-ink:#155f36;
  --ok-line:#9bd6ad;
  --wait-bg:#ffcc99;
  --wait-ink:#8a4a04;
  --wait-line:#e8b078;
  --shadow:0 1px 2px rgba(20,24,27,.06),0 8px 24px -16px rgba(20,24,27,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101418;
    --surface:#171d22;
    --surface-2:#1e252b;
    --ink:#e7ecee;
    --muted:#94a4ad;
    --line:#283138;
    --line-strong:#3a464e;
    --accent:#66b6d3;
    --accent-ink:#9ed3e6;
    --accent-wash:#16303c;
    --ok-bg:#1d4632;
    --ok-ink:#93e3b0;
    --ok-line:#2f6b4c;
    --wait-bg:#4a3218;
    --wait-ink:#f2b978;
    --wait-line:#6d4c26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101418;
  --surface:#171d22;
  --surface-2:#1e252b;
  --ink:#e7ecee;
  --muted:#94a4ad;
  --line:#283138;
  --line-strong:#3a464e;
  --accent:#66b6d3;
  --accent-ink:#9ed3e6;
  --accent-wash:#16303c;
  --ok-bg:#1d4632;
  --ok-ink:#93e3b0;
  --ok-line:#2f6b4c;
  --wait-bg:#4a3218;
  --wait-ink:#f2b978;
  --wait-line:#6d4c26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:14px 22px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.bar h1{
  font-family:Newsreader,Georgia,serif;
  font-weight:600;font-size:23px;letter-spacing:-.01em;margin:0;
}
.bar .sub{color:var(--muted);font-size:13px}
.counts{margin-left:auto;display:flex;gap:16px;font-size:12.5px;color:var(--muted);align-items:baseline}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;align-self:center}
.lang button{
  background:var(--surface);border:0;padding:4px 10px;cursor:pointer;
  font-size:11.5px;letter-spacing:.06em;font-weight:600;color:var(--muted);
}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.build{
  align-self:center;display:inline-flex;align-items:center;gap:7px;
  font-size:11px;color:var(--muted);
}
.build code{font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.build button{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
  padding:2px 8px;border-radius:6px;cursor:pointer;font-size:11px;
}
.build button:hover{border-color:var(--accent);color:var(--accent-ink)}
.refresh{
  align-self:center;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:4px 11px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;
}
.refresh:hover{border-color:var(--accent);color:var(--accent-ink)}
.refresh[aria-busy="true"]{opacity:.6;cursor:progress}
.refresh .spin{
  width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--accent);
}
.refresh[aria-busy="true"] .spin{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.refresh[aria-busy="true"] .spin{animation:none}}

/* ---------- rail folders ---------- */
.grp{margin-bottom:6px}
.grp-h{
  width:100%;display:flex;align-items:center;gap:7px;
  background:transparent;border:0;cursor:pointer;
  padding:7px 8px 6px;border-radius:6px;text-align:left;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--muted);
}
.grp-h:hover{background:var(--surface)}
.grp-h .caret{font-size:9px;width:9px;flex:none;transition:transform .15s}
.grp-h[aria-expanded="false"] .caret{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.grp-h .caret{transition:none}}
.grp-h .n{
  margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;
  font-variant-numeric:tabular-nums;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;padding:0 7px;
}
.grp.is-open > .grp-h{color:var(--ink)}
.grp-body{padding-left:2px}
.grp-empty{font-size:12px;color:var(--muted);font-style:italic;padding:2px 10px 6px}

/* ---------- bottom panel ---------- */
.panel{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.panel-h{
  width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;
  cursor:pointer;padding:6px 2px;text-align:left;color:var(--muted);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
}
.panel-h:hover{color:var(--ink)}
.panel-h .caret{font-size:9px;transition:transform .15s}
.panel-h[aria-expanded="false"] .caret{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.panel-h .caret{transition:none}}
.panel-body{padding-top:8px}
.inp{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;
  background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%;
}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea.inp{resize:vertical;line-height:1.5}
.rep-prev{
  margin:12px 0 0;padding:12px 14px;border-radius:7px;white-space:pre-wrap;
  background:var(--surface-2);border:1px solid var(--line);
  font-family:"Public Sans",sans-serif;font-size:13px;line-height:1.55;
  max-height:280px;overflow:auto;
}

/* ---------- our outreach ---------- */
.shell.tabla-on{grid-template-columns:232px minmax(0,1fr)}
.tabla{padding:20px 24px 60px;background:var(--paper);overflow:auto}
.tabla-cab h3{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:600;margin:0 0 4px}
.tabla-wrap{
  margin-top:14px;overflow-x:auto;
  border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);
  box-shadow:var(--shadow);
}
table.outreach{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
table.outreach th,table.outreach td{
  padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  text-align:left;vertical-align:top;white-space:nowrap;
}
table.outreach thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);
  border-bottom:1px solid var(--line-strong);
}
table.outreach th .cn{display:block;font-size:11px;font-weight:600}
table.outreach th .cl{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);font-weight:400}
table.outreach td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
table.outreach td.dom{font-weight:600}
table.outreach .sticky{position:sticky;left:0;z-index:1;background:var(--surface-2)}
table.outreach thead .sticky{z-index:3}
table.outreach .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:right}
table.outreach td.cambia{background:var(--wait-bg);color:var(--wait-ink);font-weight:600}
table.outreach td.ancha{white-space:normal;min-width:260px;max-width:420px;font-family:"Public Sans",sans-serif}
table.outreach tbody tr:hover td:not(.sticky){background:var(--accent-wash)}
table.outreach tbody tr:last-child td{border-bottom:0}
.dom.is-tabla .d-name{font-weight:600}

/* ---------- the conversation ---------- */
.turn{
  margin:0 0 8px;padding:9px 12px;border-radius:9px;font-size:13px;line-height:1.5;
  border:1px solid;max-width:94%;
}
.turn:last-child{margin-bottom:0}
.turn.us{
  background:var(--accent-wash);border-color:var(--accent);
  margin-left:auto;border-bottom-right-radius:2px;
}
.turn.them{
  background:var(--surface-2);border-color:var(--line-strong);
  border-bottom-left-radius:2px;
}
.turn .who{
  display:block;font-size:11px;font-weight:700;letter-spacing:.02em;margin-bottom:3px;
  font-family:"IBM Plex Mono",monospace;
}
.turn.us .who{color:var(--accent-ink)}
.turn.them .who{color:var(--muted)}
.turn .who .ts{font-weight:400;opacity:.75}
.turn .who .live{
  font-weight:400;padding:0 5px;margin-left:5px;border-radius:20px;
  border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink);font-size:10px;
}
.turn .body{white-space:pre-wrap}
.thread-note{font-size:12px;color:var(--muted);margin:10px 0 0}
.thread-last{
  margin:0 0 10px;padding:7px 11px;border-radius:7px;font-size:12.5px;font-weight:600;
  border:1px solid;
}
.thread-last.us{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.thread-last.them{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}

/* ---------- sweep box ---------- */
.newsbox{
  margin:0 0 12px;padding:12px 14px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);
}
/* Thread identity: the exact subject the mailbox carries and which mailbox
   holds their latest message. Quiet by default — it only needs to be read when
   something looks off — so it sits flush under the subject field, not boxed
   like a warning. */
.hilobox{
  margin:2px 0 10px;padding:8px 10px;border-radius:7px;font-size:12.5px;line-height:1.5;
  background:var(--surface-2,rgba(127,127,127,.06));border:1px solid var(--line);
}
.hilobox b{font-family:Newsreader,Georgia,serif;font-size:13.5px}
/* Their actual email. This sits ABOVE the draft on purpose: the draft only
   makes sense once you have read what they said, and reading it here is the
   whole point — it is what used to mean opening Outlook. */
.frescura{margin:0 0 10px;padding:8px 11px;border-radius:7px;font-size:12.5px;line-height:1.5}
.frescura.vieja{background:var(--care-bg,rgba(200,140,40,.14));border:1px solid var(--care-fg,rgba(168,106,18,.45))}
.frescura.vieja b{font-family:Newsreader,Georgia,serif;font-size:13.5px}
.frescura.fresca{background:transparent;border:0;padding:2px 0;color:var(--muted);font-size:11.5px}
td.num.nueva{color:var(--care-fg,#a86a12);font-weight:600;font-size:11px;letter-spacing:.02em}
.cuerpobox{margin:0 0 12px}
.cuerpobox .cab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.cuerpobox .cab b{font-family:Newsreader,Georgia,serif;font-size:14px}
.cuerpobox .meta{font-size:11.5px;color:var(--muted)}
.cuerpobox .sinleer{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;
  padding:1px 6px;border-radius:20px;background:var(--care-bg,rgba(200,140,40,.16));
  color:var(--care-fg,#a86a12)
}
.cuerpobox pre{
  margin:0;padding:10px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;
  font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--surface);border:1px solid var(--line-strong);max-height:340px;overflow:auto
}
.cuerpobox pre.citado{opacity:.62;margin-top:6px;font-size:12px;max-height:220px}
.cuerpobox .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cuerpobox .lnk{
  background:none;border:0;padding:0;font:inherit;font-size:12px;
  color:var(--link,#2b6cb0);cursor:pointer;text-decoration:underline
}
.cuerpobox .aviso{
  margin-top:8px;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.55;
  background:var(--care-bg,rgba(200,140,40,.12));border:1px solid var(--care-fg,rgba(168,106,18,.4))
}
.newsbox h4{margin:0 0 8px;font-family:Newsreader,Georgia,serif;font-size:15px;font-weight:600}
.newsbox .when{font-size:11.5px;color:var(--muted);margin:0 0 10px}
.newsbox ul{margin:0 0 4px;padding-left:0;list-style:none}
.newsbox li{
  padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45;
}
.newsbox li:first-child{border-top:0}
.newsbox .who{font-family:"IBM Plex Mono",monospace;font-size:12px;word-break:break-all}
.newsbox .tag{
  display:inline-block;padding:0 6px;border-radius:20px;border:1px solid;
  font-size:10.5px;font-weight:700;letter-spacing:.03em;margin-left:6px;vertical-align:1px;
}
.newsbox .tag.nuevo{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.newsbox .tag.stale{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent)}
.newsbox .tag.viejo{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
.newsbox .gist{margin:5px 0 0;color:var(--muted);font-size:12.5px}
.prob{margin:8px 0 0;padding:8px 11px;border-left:3px solid var(--warn,#c98a00);background:rgba(201,138,0,.10);border-radius:0 4px 4px 0;font-size:12.5px;line-height:1.5}
.newsbox .prob{
  margin:0;padding:9px 12px;border-radius:7px;font-size:13px;
  background:var(--wait-bg);color:var(--wait-ink);border:1px solid var(--wait-line);
}
.newsbox .prob b{font-weight:700}
.newsbox .prob a{color:inherit}
.newsbox .close{
  margin-top:9px;border:1px solid var(--line-strong);background:var(--surface-2);
  color:var(--ink);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;
}

/* ---------- shell ---------- */
.shell{
  display:grid;
  grid-template-columns:232px minmax(0,1.08fr) minmax(0,1fr);
  gap:0;
  height:calc(100vh - 57px);
  min-height:520px;
}
.rail,.pane{overflow-y:auto;overflow-x:hidden}
.rail{
  border-right:1px solid var(--line);
  background:var(--surface-2);
  padding:12px 10px 40px;
}
.finder{position:relative;margin:0 0 8px}
.finder input{width:100%;box-sizing:border-box;padding:7px 26px 7px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px}
.finder input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.finder button{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--dim);font-size:17px;line-height:1;cursor:pointer;padding:2px 5px}
.find-said{margin:0 0 8px;font-size:11.5px;color:var(--dim);line-height:1.4}
.grp.is-hit>.grp-h .lbl{text-decoration:underline;text-underline-offset:3px}
.dom .hitwhere{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.btn.is-off{opacity:.45;pointer-events:none}
.lastup{font-size:11px;color:var(--dim);line-height:1.3;text-align:right;max-width:190px}
.lastup b{color:var(--ink);font-weight:600}
.chip.no{background:#3a2a2a;border-color:#5a3a3a;color:#e0a0a0}
.rail-label,.pane-label{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
  margin:4px 6px 10px;
}
.dom{
  width:100%;text-align:left;cursor:pointer;
  display:block;padding:9px 10px;margin-bottom:2px;
  background:transparent;border:1px solid transparent;border-radius:6px;
  line-height:1.32;
}
.dom:hover{background:var(--surface)}
.dom[aria-current="true"]{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow)}
.dom .d-name{font-weight:500;font-size:13.5px;word-break:break-all}
.dom .d-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.dot.s-ok{background:var(--ok-ink)}
.dot.s-care{background:var(--wait-ink)}
.dot.s-no{background:var(--line-strong);box-shadow:inset 0 0 0 2px var(--surface-2)}
.dom.is-no .d-name{text-decoration:line-through;text-decoration-thickness:1px;opacity:.72}

.banner{
  display:flex;gap:9px;align-items:baseline;
  padding:9px 13px;border-radius:8px;margin-bottom:14px;
  font-size:13.5px;border:1px solid;
}
.banner b{font-weight:600}
.banner.s-ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.banner.s-care{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.banner.s-no{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
.banner.s-sent{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.banner.s-mismatch{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.banner small{display:block;font-weight:400;margin-top:3px;opacity:.85}
.hidden{display:none !important}
.lanzador{
  margin-top:10px;padding:10px 13px;border-radius:8px;font-size:13px;
  background:var(--accent-wash);border:1px solid var(--accent);color:var(--ink);
}
.lanzador b{font-weight:600}
.lanzador button{
  margin-top:7px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;
}

/* ---------- panes ---------- */
.pane{padding:20px 24px 60px;background:var(--paper)}
.pane.draft{border-right:1px solid var(--line);background:var(--surface)}

.field{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.field .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);width:72px;flex:none;font-weight:600}
.field .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;word-break:break-all}

.sender{display:flex;gap:6px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{
  background:var(--surface);border:0;padding:5px 11px;cursor:pointer;
  font-size:12.5px;font-family:"IBM Plex Mono",monospace;color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.es-copia{color:var(--warn,#c98a00) !important;border-color:var(--warn,#c98a00) !important}
.aviso-celdas{margin-top:6px;padding:6px 9px;border-left:3px solid var(--bad,#c0392b);background:rgba(192,57,43,.09);border-radius:0 4px 4px 0;max-width:70ch;line-height:1.45}
.aviso-filas{margin-top:6px;padding:6px 9px;border-left:3px solid var(--warn,#c98a00);background:rgba(201,138,0,.08);border-radius:0 4px 4px 0;max-width:70ch;line-height:1.45}

.tabs{display:flex;gap:4px;margin:18px 0 0}
.tab{
  background:transparent;border:1px solid transparent;border-bottom:0;
  padding:6px 13px;cursor:pointer;font-size:13px;color:var(--muted);
  border-radius:7px 7px 0 0;
}
.tab[aria-selected="true"]{
  background:var(--surface-2);border-color:var(--line);
  color:var(--ink);font-weight:500;
}
textarea#body{
  width:100%;min-height:330px;resize:vertical;
  padding:16px 18px;
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line);border-radius:0 8px 8px 8px;
  font-family:"Public Sans",sans-serif;font-size:14.5px;line-height:1.62;
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{
  border:1px solid var(--line-strong);background:var(--surface);
  padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;
  text-decoration:none;display:inline-block;color:var(--ink);
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500;text-decoration:none;display:inline-block}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface);border-color:var(--accent)}
.said{font-size:12.5px;color:var(--ok-ink);opacity:0;transition:opacity .18s}
.said.on{opacity:1}
@media (prefers-reduced-motion:reduce){.said{transition:none}}

/* ---------- evidence ---------- */
.block{
  background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow);
}
.block h3{
  font-family:Newsreader,Georgia,serif;font-weight:600;font-size:16px;
  margin:0 0 10px;letter-spacing:-.005em;
}
table.row{width:100%;border-collapse:collapse;font-size:13px}
table.row td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.row tr:last-child td{border-bottom:0}
table.row td.k{color:var(--muted);width:34%;white-space:nowrap}
table.row td.v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;word-break:break-all}
table.row td.c{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.chip{
  display:inline-block;padding:1px 7px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid;
}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.chip.wait{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.empty{color:var(--muted);font-style:italic}

blockquote{
  margin:0 0 10px;padding:9px 13px;
  border-left:3px solid var(--accent);
  background:var(--accent-wash);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.55;
  border-radius:0 6px 6px 0;
}
blockquote:last-child{margin-bottom:0}
.src{display:block;margin-top:6px;font-family:"Public Sans",sans-serif;font-size:11.5px;color:var(--muted)}
.paraphrase{font-size:13px;color:var(--muted);margin:0 0 8px;padding-left:13px;border-left:3px solid var(--line-strong)}
ul.asks{margin:0;padding-left:18px;font-size:13.5px}
ul.asks li{margin-bottom:5px}
.warn{border-color:var(--wait-line);background:linear-gradient(0deg,var(--surface),var(--surface))}
.warn h3{color:var(--wait-ink)}
.warn p{margin:0;font-size:13.5px}

@media (max-width:1040px){
  .shell{grid-template-columns:1fr;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px}
  .rail-label{display:none}
  .dom{width:auto;flex:none;min-width:160px}
  .pane.draft{border-right:0;border-bottom:1px solid var(--line)}
}

/* ---------- state ---------- */
const KEY = "mesa-cotejo-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }
/* Qué fichas ha tocado el usuario desde que abrió: initDb no las pisa. */
const tocadasEnEstaSesion = {};
function save(id){
  if(id) tocadasEnEstaSesion[id] = true;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){
    /* Perder las marcas en silencio es lo peor que puede pasar aquí. Se hace
       sitio tirando el caché de cuerpos y, si aun así falla, se avisa. */
    try { CUERPOS = {}; localStorage.removeItem(CUERPOS_KEY); localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e2){ try { flash(lang === "en"
      ? "Browser storage is full — marks are not being saved locally."
      : "El almacenamiento del navegador está lleno — las marcas no se están guardando aquí."); } catch(e3){} }
  }
  guardarEnServidor();
}

/* El documento del servidor se escribía ENTERO en cada pulsación de tecla, con
   set() y sin fusión. Dos pestañas o dos máquinas se borraban las marcas entre
   sí: la última en escribir mandaba su foto completa, incluida la parte que
   había cargado antes de que la otra tocara nada, y lo hacía en silencio.
   Ahora se agrupa (no una escritura por tecla) y antes de escribir se relee y
   se respeta lo que haya cambiado otro, salvo las fichas que ha tocado ESTA
   sesión, que son las únicas que este navegador tiene derecho a pisar. */
let guardadoPendiente = null;
function guardarEnServidor(){
  if(!dbHandle) return;
  if(guardadoPendiente) clearTimeout(guardadoPendiente);
  guardadoPendiente = setTimeout(async () => {
    guardadoPendiente = null;
    try {
      const doc = dbHandle.doc("config/state");
      let remoto = {};
      try { const g = await doc.get(); if(g.exists()) remoto = g.data() || {}; } catch(e){}
      const fusion = {};
      Object.keys(remoto).forEach(k => {
        const v = remoto[k];
        if(v && typeof v === "object" && !Array.isArray(v)) fusion[k] = v;
      });
      Object.keys(state).forEach(k => {
        // lo tocado aquí manda; lo demás sólo entra si el servidor no lo tiene
        if(tocadasEnEstaSesion[k] || !fusion[k]) fusion[k] = state[k];
      });
      Object.keys(fusion).forEach(k => { state[k] = fusion[k]; });
      await doc.set(fusion);
    } catch(e){}
  }, 900);
}

/* ---------- db persistence (replaces localStorage as the durable store) ----------
   claude.use("db") gives us a server-side JSON store that survives page reloads
   and browser-context changes. We write here in parallel with localStorage so
   both work; on load, the db value is authoritative and wins over localStorage. */
let dbHandle = null;
async function initDb(){
  if(typeof claude === "undefined" || !claude || typeof claude.use !== "function") return;
  try {
    dbHandle = await claude.use("db");
    if(!dbHandle) return;

    /* Restore the timestamp of the last successful email sweep. Without this,
       every page reload shows "nunca en este navegador" even when we refreshed
       seconds ago — because lastSweep is memory-only. */
    try {
      const meta = await dbHandle.doc("sweep/meta").get();
      if(meta.exists()){
        const d = meta.data();
        if(d && d.leidoEn && !lastSweep){
          lastSweep = {leidoEn: d.leidoEn, fromDb:true, filas:[], mismatches:[], asuntos:[], reabiertas:[]};
          const lu = document.getElementById("lastup");
          if(lu){
            lu.innerHTML = "";
            const b1 = document.createElement("b");
            b1.textContent = shortDate(d.leidoEn);
            lu.appendChild(document.createTextNode(t("lastupMail") + " "));
            lu.appendChild(b1);
            lu.appendChild(document.createElement("br"));
            lu.appendChild(document.createTextNode(t("lastupPage") + " " + BUILD.split(" · ")[0]));
          }
        }
      }
    } catch(e){}

    /* Restore publisher queue state. The db value wins over localStorage because
       it is the most recent write: a mark made in any browser/tab session is
       here as soon as the next page opens. */
    try {
      const stDoc = await dbHandle.doc("config/state").get();
      if(stDoc.exists()){
        const dbSt = stDoc.data() || {};
        let changed = false;
        Object.keys(dbSt).forEach(k => {
          /* Lo que el usuario haya tocado en este segundo NO se pisa. Antes el
             servidor ganaba siempre: si marcabas una ficha mientras la página
             aún arrancaba, la marca se deshacía sola delante de tus ojos. */
          if(tocadasEnEstaSesion[k]) return;
          const v = dbSt[k];
          if(!v || typeof v !== "object" || Array.isArray(v)) return;
          if(JSON.stringify(state[k]) !== JSON.stringify(v)){
            state[k] = v; changed = true;
          }
        });
        if(changed){
          /* El servidor puede mover la cola: una ficha que aquí estaba por
             contestar puede llegar ya marcada como enviada. Si el usuario
             todavía no ha tocado nada, se reabre en la cabeza real de la cola
             en vez de dejarlo en una ficha que ya no toca. */
          if(current === autoAbierta){
            const id = primeraPorContestar();
            if(id){ current = id; autoAbierta = id; }
          }
          renderAll();
          scrollAlActual();
        }
      }
    } catch(e){}

    /* Restore thread links so «Copiar y abrir el hilo» works immediately after
       reload. Pasa por el mismo filtro que el navegador: un enlace del
       servidor sólo pisa al seed si nació de este seed. Antes esto no tenía
       ninguna comprobación y era el sitio donde la corrección se perdía —
       la constante de versión limpiaba el navegador pero nunca el servidor. */
    try {
      const thDoc = await dbHandle.doc("config/threads").get();
      if(thDoc.exists()){
        const d = thDoc.data() || {};
        if(d.links && d.ver === THREADS_VER) aplicarGuardados(d.links);
        else if(d.links) dbHandle.doc("config/threads").set({ver: THREADS_VER, links: {}}).catch(()=>{});
        else {
          /* Formato viejo: el documento era el mapa suelto. Se descarta y se
             reescribe en el nuevo, o seguiría pisando al seed para siempre. */
          dbHandle.doc("config/threads").set({ver: THREADS_VER, links: {}}).catch(()=>{});
        }
      }
    } catch(e){}

    /* Restore mailbox list. Seeded into localStorage so the sync mailboxes()
       function finds it on the next call without being made async. */
    try {
      const bzDoc = await dbHandle.doc("config/mailboxes").get();
      if(bzDoc.exists()){
        const d = bzDoc.data();
        if(d && Array.isArray(d.lista) && d.lista.length){
          /* La huella viaja con la lista: si en el servidor está la que editó
             alguien a mano, aquí tiene que seguir mandando ella; si es una
             lista vieja sin marcar, mailboxes() le sumará los buzones nuevos. */
          try {
            localStorage.setItem(MAILBOXES_KEY, JSON.stringify(d.lista));
            if(d.fp === "a-mano") localStorage.setItem(MAILBOXES_FP_KEY, "a-mano");
            else localStorage.removeItem(MAILBOXES_FP_KEY);
          } catch(e){}
        }
      }
    } catch(e){}

  } catch(e){}
}

function st(id){
  /* Si lo guardado no es un objeto (formato viejo, escritura a medias), asignar
     sobre él no falla: se descarta en silencio y la ficha queda muerta. */
  let s = state[id];
  if(!s || typeof s !== "object" || Array.isArray(s)) s = state[id] = {};
  if(["sent","redo","pend","closed","done"].indexOf(s.status) < 0) s.status = "pend";
  if(typeof s.variant !== "number" || !isFinite(s.variant) || s.variant < 0) s.variant = 0;
  if(s.sender !== "mauro" && s.sender !== "simon") s.sender = null;
  if(typeof s.body !== "string") s.body = null;
  if(typeof s.note !== "string") s.note = "";
  if(typeof s.markedAt !== "string") s.markedAt = null;
  return s;
}

let current = DOMAINS[0].id;
const byId = id => DOMAINS.find(d => d.id === id) || DOMAINS[0];

/* ---------- has the publisher written since we marked it? ----------
   This is the rule Simon asked for out loud: a record we sent goes to Sent,
   and the day they answer it has to be back in «Por contestar». Before this,
   the folder was decided by our own mark alone — d.enviado, or s.status ===
   "sent" kept in the browser — so a reply could land and the record would sit
   in Sent for ever, invisible, because nothing ever cleared the mark.

   ultimaRespuesta is the date of their newest incoming email, read off the
   mailbox and baked into the record. Compared against when we marked it, it
   answers the only question that matters: is the ball ours again? If it is,
   the mark is stale and every folder below honours that over the mark.

   Both sides are UTC. enviado.iso exists for exactly this: enviado.hora is
   prose in Bogota time and cannot be compared to anything. */
/* ---------- de quién es el turno ----------
   La pregunta que decide todo: ¿el último correo del hilo es suyo o nuestro?
   Si es nuestro, estamos esperando: la ficha no pinta nada en la cola. Si es
   suyo, nos toca.

   Las dos mitades se leen del buzón en cada refresco, de LOS DOS buzones, y
   por eso da igual que un hilo de mauro@ se conteste desde simon@ — que es
   exactamente lo que se me escapaba cuando esto lo decidía yo a mano.

   NUESTRO/ULTIMO son lo leído en este navegador; d.nuestroUltimo y
   d.ultimaRespuesta son la semilla publicada, para que la ficha diga algo
   sensato antes del primer refresco. Lo leído manda: nunca es más viejo. */
const NUESTRO = {};

function cuandoSuyo(d){
  const live = ULTIMO[d.id] && ULTIMO[d.id].when;
  const seed = d.ultimaRespuesta;
  const a = live ? +new Date(live) : 0, b = seed ? +new Date(seed) : 0;
  const t = Math.max(a, b);
  return t || null;
}
function cuandoNuestro(d, s){
  let t = 0;
  const live = NUESTRO[d.id] && NUESTRO[d.id].when;
  if(live) t = Math.max(t, +new Date(live) || 0);
  if(d.nuestroUltimo && d.nuestroUltimo.when) t = Math.max(t, +new Date(d.nuestroUltimo.when) || 0);
  // Marcarla a mano cuenta como haber contestado, hasta que el buzón diga otra cosa.
  if(s && s.markedAt) t = Math.max(t, +new Date(s.markedAt) || 0);
  return t || null;
}
/* "suya"     esperamos nosotros, no hay nada que mandar
   "nuestra"  nos toca contestar
   "acuse"    nos toca, pero su último correo es un «ok, gracias»: nada que decir
   "sin-datos" no hay ni un correo por ninguna parte */
function turno(d, s){
  const suyo = cuandoSuyo(d), mio = cuandoNuestro(d, s);
  if(!suyo && !mio) return "sin-datos";
  if(!mio) return "nuestra";
  if(!suyo) return "suya";
  if(mio > suyo) return "suya";
  /* suAcuse describe UN correo concreto: el que había cuando se publicó la
     página. Antes valía para siempre, así que cualquier respuesta posterior se
     seguía clasificando como «solo acusaron recibo» y la ficha no volvía nunca
     a la cola — motorpoint llevaba así con cinco preguntas abiertas. Sólo se
     respeta mientras no haya llegado nada más nuevo que ese correo. */
  if(!d.suAcuse) return "nuestra";
  const sello = d.ultimaRespuesta ? (+new Date(d.ultimaRespuesta) || 0) : 0;
  return (sello && suyo > sello) ? "nuestra" : "acuse";
}
function nosToca(d, s){ const v = turno(d, s); return v === "nuestra" || v === "sin-datos"; }

function marcadaEn(d, s){
  let t = 0;
  if(s && s.markedAt){ const v = new Date(s.markedAt).getTime(); if(v) t = Math.max(t, v); }
  return t;
}
/* Antes esto leía d.ultimaRespuesta, que es una foto del día que se publicó la
   página, mientras turno() leía el buzón vivo. Dos funciones contestando la
   misma pregunta con datos distintos: una ficha podía estar «reabierta» para
   una y no para la otra. Ahora las dos salen de cuandoSuyo(). */
function reabierta(d, s){
  const r = cuandoSuyo(d);
  if(!r) return false;
  const m = marcadaEn(d, s);
  if(!m) return false;          // never marked: it is already in the queue
  return r > m;
}

/* ---------- render ---------- */
/* Los contadores de arriba salían de una aritmética propia que no sabía de
   «cerrada» ni «hecha», así que la cabecera decía 24 pendientes y la carpeta
   mostraba 21. Ahora cuentan con las MISMAS pruebas que arman el rail: una
   sola definición de cada montón. */
/* Las pruebas de FOLDERS se solapan a propósito (la última acepta todo para
   que nada desaparezca), así que el reparto es por ORDEN: cada ficha va a la
   primera carpeta que la acepta y a ninguna más. Una sola función lo decide,
   y el rail, los contadores y el buscador la usan los tres. */
function carpetaDe(d, s){
  const c = FOLDERS.find(f => f.test(d, s || st(d.id)));
  return c ? c.key : "no";
}
function fichasDe(key){
  return DOMAINS.filter(d => carpetaDe(d, st(d.id)) === key);
}
function cuentaCarpeta(key){ return fichasDe(key).length; }
function counts(){
  const set = (id, n) => { const el = document.getElementById(id); if(el) el.textContent = n; };
  set("c-sent", cuentaCarpeta("sent"));
  set("c-redo", cuentaCarpeta("redo"));
  set("c-pend", cuentaCarpeta("pend"));
  set("c-no",   cuentaCarpeta("no"));
}

/* ---------- rail folders ----------
   The order is fixed: what is still to do sits at the top and finished
   work is filed below, collapsed. A record moves folder by itself as soon
   as it is marked sent, so done work stops crowding what is pending. */
const FOLDERS = [
  /* reabierta() first, and on purpose: their answer beats our mark. Without
     that clause a record marked sent stayed in Sent after they replied, which
     is the one thing this rail must never do. */
  /* Una sola pregunta decide la carpeta: ¿de quién es el último correo del
     hilo? turno() lo lee del buzón, de los dos buzones, en cada refresco. Antes
     esto dependía de una marca a mano que nadie limpiaba, y de un campo que yo
     rellenaba de memoria: por eso salían en la cola fichas ya contestadas. */
  /* «Cerrada» y «hecha» ya NO son un destino final. Si el medio vuelve a
     escribir, la ficha sale de donde esté y vuelve a la cola: contestarles es
     más importante que respetar una marca nuestra. Antes cerrada no miraba el
     turno en absoluto, así que un medio podía preguntar algo nuevo y su ficha
     se quedaba archivada en silencio para siempre. */
  {key:"pend", label:"grpPend", open:true,  test:(d,s) => d.status !== "no" && nosToca(d,s) && s.status !== "redo" && s.status !== "done"},
  {key:"redo", label:"grpRedo", open:true,  test:(d,s) => d.status !== "no" && s.status === "redo"},
  {key:"sent", label:"grpSent", open:false, test:(d,s) => d.status !== "no" && !nosToca(d,s) && s.status !== "closed" && s.status !== "done"},
  /* Sent and closed are not the same thing, and Simon asked for the
     difference to be visible: a record whose draft still asks something goes
     to Sent and comes back the day they answer; one whose draft was the
     wrap-up («ya lo anotamos todo») is finished and goes here. */
  {key:"closed", label:"grpClosed", open:false, test:(d,s) => d.status !== "no" && s.status === "closed" && !nosToca(d,s)},
  /* Dirección asked for this one: a thread that is finished AND already
     copied into the sheet is done with, and it should stop competing for
     attention with the ones that are not. */
  {key:"done", label:"grpDone", open:false, test:(d,s) => s.status === "done" && !nosToca(d,s)},
  /* Última y sin condiciones: una ficha que no encaje en ninguna de arriba
     tiene que aparecer en algún sitio. Con la combinación «hecha + han vuelto
     a escribir» no encajaba en ninguna y desaparecía del rail entera — ni en
     una carpeta, ni en el buscador, ni alcanzable de ninguna forma. */
  {key:"no",   label:"grpNo",   open:false, test:() => true}
];
/* The table is not a record but a separate view, so it lives in a folder
   with a single entry. */
const TABLE_VIEW = "__outreach__";
const FOLDERS_KEY = "mesa-cotejo-carpetas";
let openFolders = null;
function isFolderOpen(k){
  if(openFolders === null){
    openFolders = {};
    FOLDERS.forEach(c => { openFolders[c.key] = c.open; });
    try {
      const raw = localStorage.getItem(FOLDERS_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        FOLDERS.forEach(c => { if(typeof saved[c.key] === "boolean") openFolders[c.key] = saved[c.key]; });
      }
    } catch(e) {}
  }
  return openFolders[k];
}
function saveFolders(){ try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(openFolders)); } catch(e) {} }

function recordButton(d){
  const s = st(d.id);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dom" + (d.status === "no" ? " is-no" : "");
  b.setAttribute("aria-current", d.id === current ? "true" : "false");
  const tn = turno(d, s);
  const status = d.status === "no" ? t("stNo")
               : tn === "suya" ? t("stEsperando")
               : tn === "acuse" ? t("stAcuse")
               : s.status === "done" ? t("stDone")
               : reabierta(d, s) ? t("stReabierta")
               : s.status === "closed" ? t("stClosed")
               : s.status === "sent" ? t("stSent")
               : s.status === "redo" ? t("stRedo") : t("stPend");
  b.innerHTML = '<span class="d-name"></span><span class="d-meta"><span class="dot s-' +
    (d.status === "no" ? "no" : tn === "suya" ? "ok" : tn === "acuse" ? "ok" : d.status) +
    '"></span><span class="st"></span></span>';
  b.querySelector(".d-name").textContent = d.domain;
  const v = verifySend(d);
  const extra = verifyLabel(v);
  b.querySelector(".st").textContent = extra ? (status + " · " + extra) : status;
  // While searching, say which folder this record is in: that is the question.
  if(finderQuery.trim()){
    const w = document.createElement("span");
    w.className = "hitwhere";
    w.textContent = t("findIn")(folderOf(d));
    b.querySelector(".d-name").appendChild(w);
  }
  if(reabierta(d, s) || v.verdict === "desfasado" || v.verdict === "sin-rastro" || v.verdict === "sin-marcar" || v.verdict === "otro-destino"){
    b.querySelector(".dot").className = "dot s-care";
  }
  b.addEventListener("click", () => { current = d.id; renderAll(); fetchFicha(d.id); });
  return b;
}

/* ---------- the finder ----------
   With 35 records in five folders, "where did that one go" became a real
   question, and the answer used to be opening every folder. Typing here
   filters the rail and, for each match, says which folder it is sitting in —
   because knowing it exists is useless if you cannot see whether it is still
   waiting or already sent.

   It matches the domain, every domain and address in ALIAS, the recipient
   address and the contact's name, so «rafael», «almeria» and «director@»
   all find the same record. */
let finderQuery = "";

function haystack(d){
  const parts = [d.domain, d.to, d.label, (d.row && d.row["Nombre"] && d.row["Nombre"][0]) || ""];
  (ALIAS[d.id] || []).forEach(x => parts.push(x));
  parts.push(d.id);
  return parts.join(" ").toLowerCase();
}

function folderOf(d){
  const c = FOLDERS.find(f => f.key === carpetaDe(d, st(d.id)));
  return c ? t(c.label) : "";
}

function renderRail(){
  const rail = document.getElementById("rail");
  rail.querySelectorAll(".grp").forEach(n => n.remove());

  // Our outreach goes first: it is what has to be copied into the sheet.
  const searching = !!finderQuery.trim();
  const gOut = document.createElement("div");
  gOut.className = "grp is-open";
  const hOut = document.createElement("button");
  hOut.type = "button"; hOut.className = "grp-h";
  hOut.setAttribute("aria-expanded", "true");
  hOut.innerHTML = '<span class="caret" aria-hidden="true">▾</span><span class="lbl"></span><span class="n"></span>';
  hOut.querySelector(".lbl").textContent = t("grpOut");
  hOut.querySelector(".n").textContent = CLOSED_ROWS.length;
  hOut.addEventListener("click", () => { current = TABLE_VIEW; renderAll(); });
  gOut.appendChild(hOut);
  const bOut = document.createElement("div");
  bOut.className = "grp-body";
  const btnOut = document.createElement("button");
  btnOut.type = "button";
  btnOut.className = "dom is-tabla";
  btnOut.setAttribute("aria-current", current === TABLE_VIEW ? "true" : "false");
  btnOut.innerHTML = '<span class="d-name"></span><span class="d-meta"><span class="dot s-ok"></span><span class="st"></span></span>';
  btnOut.querySelector(".d-name").textContent = t("outVer");
  btnOut.querySelector(".st").textContent = CLOSED_ROWS.length + " " +
    (lang === "en" ? "rows" : "filas");
  btnOut.addEventListener("click", () => { current = TABLE_VIEW; renderAll(); });
  bOut.appendChild(btnOut);
  gOut.appendChild(bOut);
  if(!searching) rail.appendChild(gOut);

  const q = finderQuery.trim().toLowerCase();
  const matches = q ? DOMAINS.filter(d => haystack(d).indexOf(q) >= 0) : null;

  FOLDERS.forEach(c => {
    let items = fichasDe(c.key);
    // While searching, a folder shows only its matches and opens itself; one
    // with none is dropped, so the rail is the answer and not a haystack.
    if(matches){
      items = items.filter(d => matches.indexOf(d) >= 0);
      if(!items.length) return;
    }
    // The folder holding the open record always expands, no exceptions.
    const hasCurrent = items.some(d => d.id === current);
    const open = matches ? true : (isFolderOpen(c.key) || hasCurrent);

    const wrap = document.createElement("div");
    wrap.className = "grp" + (open ? " is-open" : "") + (matches ? " is-hit" : "");

    const h = document.createElement("button");
    h.type = "button"; h.className = "grp-h";
    h.setAttribute("aria-expanded", open ? "true" : "false");
    h.innerHTML = '<span class="caret" aria-hidden="true">▾</span><span class="lbl"></span><span class="n"></span>';
    h.querySelector(".lbl").textContent = t(c.label);
    h.querySelector(".n").textContent = items.length;
    h.addEventListener("click", () => {
      openFolders[c.key] = !open;
      saveFolders();
      renderRail();
    });
    wrap.appendChild(h);

    const body = document.createElement("div");
    body.className = "grp-body";
    if(!open){ body.hidden = true; }
    if(items.length){
      items.forEach(d => body.appendChild(recordButton(d)));
    } else {
      const p = document.createElement("p");
      p.className = "grp-empty";
      p.textContent = t("grpNone");
      body.appendChild(p);
    }
    wrap.appendChild(body);
    rail.appendChild(wrap);
  });

  const said = document.getElementById("find-said");
  if(said){
    if(!q){ said.hidden = true; said.textContent = ""; }
    else {
      said.hidden = false;
      said.textContent = matches.length
        ? t("findFound")(matches.length)
        : t("findNone")(finderQuery.trim());
    }
  }
  const x = document.getElementById("find-x");
  if(x) x.hidden = !q;
}

function renderDraft(){
  const d = byId(current), s = st(current);
  const senderKey = effectiveSender(d, s);

  const banner = document.getElementById("banner");
  /* Aquí había un banner entero para d.enviado, un campo que NO existe en
     ninguna de las 45 fichas: código inalcanzable desde siempre. Es lo que
     hizo que cinco definiciones distintas de «esto está enviado» se fueran
     desincronizando, porque había que mantenerlas a todas de acuerdo sobre
     un campo vacío. Fuera. */

  const v = verifySend(d);
  const aviso = (v.verdict === "desfasado" || v.verdict === "sin-rastro" || v.verdict === "sin-marcar" || v.verdict === "otro-destino");
  banner.className = "banner " + (aviso ? "s-mismatch" : v.verdict ? "s-sent" : "s-" + d.status);
  banner.innerHTML = "<div><b></b><small></small></div>";
  /* El titular dice qué hacer con la ficha; el estado de la comprobación va
     debajo. Antes era al revés y en las cuatro fichas de Enviados el titular
     quedaba en un «sin comprobar» pelado, que no dice nada y encima tapaba el
     statusText, que es lo único útil. Solo los veredictos que son un AVISO de
     verdad —el borrador es más nuevo que el último correo, no hay rastro en
     Enviados, fue a otra dirección, o hay correo nuestro y la ficha sigue
     pendiente— se ganan el titular. «sin comprobar» y «visto en Enviados» son
     información de estado, no avisos. */
  banner.querySelector("b").textContent = aviso ? verifyLabel(v) : (loc(d, "statusText") || "");
  const footer = [];
  if(v.verdict){
    if(!aviso) footer.push(verifyLabel(v));
    footer.push(v.markedAt ? (t("vMarcado") + " " + shortDate(v.markedAt)) : t("vNunca"));
    if(v.verdict === "sin-comprobar") footer.push(t("vComprueba"));
    if(aviso && loc(d, "statusText")) footer.push(loc(d, "statusText"));
    if(v.verdict === "sin-rastro") footer.push(t("vAviso"));
  }
  const tn = turno(d, s);
  if(tn === "suya") footer.push(t("pelotaSuya"));
  else if(tn === "nuestra" && d.hilo) footer.push(t("pelotaNuestra"));
  banner.querySelector("small").textContent = footer.join(" · ");

  const sendOnly = d.status === "no";
  /* A record with nothing to send hides the sending controls — but NOT the
     database one: several of those rows are exactly the ones to copy into
     the sheet. */
  ["open-thread","open-outlook","open-app","copy","mark-sent","redo","send-hint","thread-hint"].forEach(idAttr => {
    const el = document.getElementById(idAttr);
    if(el) el.classList.toggle("hidden", sendOnly);
  });
  const md = document.getElementById("mark-done");
  if(md) md.classList.remove("hidden");

  document.getElementById("f-to").textContent = d.to;
  document.getElementById("f-subject").textContent = d.subject;
  renderCuerpo(d);
  document.getElementById("sender-note").textContent = loc(d, "senderNote");
  document.getElementById("s-mauro").setAttribute("aria-pressed", senderKey === "mauro");
  document.getElementById("s-simon").setAttribute("aria-pressed", senderKey === "simon");

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  d.variants.forEach((v, i) => {
    const t = document.createElement("button");
    t.type = "button"; t.className = "tab"; t.role = "tab";
    t.setAttribute("aria-selected", i === s.variant);
    t.textContent = v.name;
    t.addEventListener("click", () => { s.variant = i; s.body = null; save(d.id); renderDraft(); });
    tabs.appendChild(t);
  });

  const ta = document.getElementById("body");
  ta.value = s.body !== null && s.body !== undefined ? s.body : composed(d, s, senderKey);
  syncMailto();
}

function composed(d, s, senderKey){
  const i = Math.min(Math.max(0, s.variant | 0), d.variants.length - 1);
  const chosen = d.variants[i] || d.variants[0];
  if(!chosen) return "";
  const v = (lang === "en" && chosen.textEn) ? chosen.textEn : chosen.text;
  return d.status === "no" ? v : v + "\n" + SIGN[senderKey].name;
}

/* Sending account.
   Reading another mailbox and composing FROM it are two different
   permissions. The connector reads mauro@ fine, because it holds delegated
   read access at application level. That grants nothing in Outlook Web: on
   2 Sep, putting the mailbox in the URL path produced
   Microsoft.Exchange.Data.StoreObjects.AccessDeniedException, because the
   viewer has no access to that mailbox.

   So the path form is used ONLY for the viewer's own mailbox, where it
   always works. For anyone else's, the page says the compose window cannot
   be opened from it rather than handing the viewer a Microsoft error page.
   Actually sending as another address needs "Send As" granted by IT. */
/* The one place that decides which mailbox a card actually sends from.
   It used to be computed separately in renderDraft and in syncMailto, and
   the two disagreed: the signature switched to Simon while the link still
   asked for mauro@'s mailbox, which is the error it was meant to avoid. */
function effectiveSender(d, s){
  if(s.sender) return s.sender;
  if(canComposeFrom(SIGN[d.sender].addr)) return d.sender;
  const mine = ownMailbox().toLowerCase();
  const k = Object.keys(SIGN).find(x => SIGN[x].addr.toLowerCase() === mine);
  return k || d.sender;
}

function ownMailbox(){
  const own = mailboxes().find(b => b.propio);
  return own ? own.addr : SIGN.simon.addr;
}
function canComposeFrom(mailbox){
  return String(mailbox).toLowerCase() === String(ownMailbox()).toLowerCase();
}
function outlookComposeUrl(mailbox, to, subject, body){
  const qs = "?to=" + encodeURIComponent(to) +
    "&subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
  // Plain form: opens in whatever mailbox the browser session already has.
  if(canComposeFrom(mailbox)) return "https://outlook.office.com/mail/deeplink/compose" + qs;
  // Kept for whoever does hold access to that mailbox — Mauro himself, say.
  return "https://outlook.office.com/mail/" + encodeURIComponent(mailbox) + "/deeplink/compose" + qs;
}

function syncMailto(){
  const d = byId(current);
  const s = st(current);
  const mailbox = SIGN[effectiveSender(d, s)].addr;
  const body = document.getElementById("body").value;

  document.getElementById("open-outlook").setAttribute("href",
    outlookComposeUrl(mailbox, d.to, d.subject, body));
  document.getElementById("open-app").setAttribute("href",
    "mailto:" + encodeURIComponent(d.to) +
    "?subject=" + encodeURIComponent(d.subject) + "&body=" + encodeURIComponent(body));

  // The button states which mailbox it will open from, so nobody has to
  // guess. Two separate warnings: the mailbox is not one you can compose
  // from, or it is not the mailbox that owns the thread.
  /* The thread comes first: replying inside it is the correct move, and a
     fresh compose is the fallback for a record with no link yet. */
  const th = document.getElementById("open-thread");
  const link = THREADS[d.id] || "";
  if(th){
    if(link){
      th.setAttribute("href", link);
      const box = THREAD_BOX[d.id];
      /* Si lo único que tenemos es la copia del agregador, hay que decirlo: ese
         enlace abre la copia de outreach@, y contestar ahí saca el correo desde
         la cuenta equivocada y fuera del hilo original. */
      if(SOLO_AGREGADOR[d.id]){
        th.textContent = t("openThread") + (lang === "en"
          ? " · copy in outreach@ — do not reply here"
          : " · copia en outreach@ — no contestar aquí");
        th.classList.add("es-copia");
      } else {
        th.textContent = t("openThread") + (box ? " · " + box + "@" : "");
        th.classList.remove("es-copia");
      }
      th.classList.remove("is-off");
      th.removeAttribute("aria-disabled");
    } else {
      th.setAttribute("href", "#");
      th.textContent = t("openThreadNone");
      th.classList.add("is-off");
      th.setAttribute("aria-disabled", "true");
    }
  }
  const hint = document.getElementById("thread-hint");
  if(hint){
    /* Si el seed de ESTA ficha no cuadra con su buzón, el enlace abre otro
       correo. Vale más decirlo aquí, encima del botón, que dejar que se
       descubra pinchando — que es como se descubrió. */
    const s = THREADS_SEED[d.id];
    const pref = s && PREFIJO_BUZON[s.box];
    const fb = (d.hilo && d.hilo.buzon) || (d.nuestroUltimo && d.nuestroUltimo.buzon);
    const roto = !!(s && ((pref && s.id.indexOf(pref) !== 0) || (fb && s.box !== fb)));
    if(roto){
      hint.textContent = lang === "en"
        ? "Careful: this thread's stored mailbox does not match the message id — the link may open the wrong email. Refresh mail to re-resolve it."
        : "Ojo: el buzón guardado de este hilo no cuadra con el id del mensaje — el enlace puede abrir otro correo. Refresca el correo para volver a resolverlo.";
      hint.classList.add("es-copia");
    } else if(fb && SIGN[fb] && SIGN[fb].addr !== ownMailbox()){
      /* El hilo vive en el buzón de otro. Es EXACTAMENTE la situación en la que
         «Responder a todos» arrastra al compañero como destinatario y el medio
         acaba viendo direcciones internas nuestras. Pasó en la prueba del 11/09:
         Tim escribió sólo a mauro@, se respondió a todos desde simon@, y el
         correo salió con mauro@ en el Para. Se avisa ANTES de abrir, no después. */
      hint.textContent = lang === "en"
        ? "This thread is in " + SIGN[fb].addr + ", not your mailbox. Use REPLY, never «Reply all» — reply-all keeps " + SIGN[fb].name + " as a recipient and the publisher sees our internal address. Best: reply from " + SIGN[fb].addr + " itself."
        : "Este hilo está en " + SIGN[fb].addr + ", que no es tu buzón. Usa RESPONDER, nunca «Responder a todos» — responder a todos deja a " + SIGN[fb].name + " como destinatario y el medio ve nuestra dirección interna. Lo mejor: contestar desde " + SIGN[fb].addr + ".";
      hint.classList.add("es-copia");
    } else {
      hint.textContent = t("threadHint");
      hint.classList.remove("es-copia");
    }
  }

  const bt = document.getElementById("open-outlook");
  const mine = canComposeFrom(mailbox);
  bt.textContent = t("openNew") + " · " + mailbox.split("@")[0] + "@" + (mine ? "" : " ⚠");
  const av = document.getElementById("aviso-buzon");
  if(av){
    let msg = "";
    if(!mine) msg = t("avisoSinAcceso")(mailbox, ownMailbox());
    else if(d.sender && SIGN[d.sender].addr.toLowerCase() !== mailbox.toLowerCase()){
      msg = t("avisoBuzon")(SIGN[d.sender].addr, mailbox);
    }
    av.classList.toggle("hidden", !msg);
    av.textContent = msg;
  }
}

function renderEvidence(){
  const d = byId(current);
  document.getElementById("ev-domain").textContent = d.domain + " — " + loc(d, "label");

  const tb = document.getElementById("ev-row");
  tb.innerHTML = "";
  Object.entries(d.row).forEach(([k, [v, status, cell]]) => {
    const tr = document.createElement("tr");
    const chip = status === "ok" ? '<span class="chip ok">' + t("chipOk") + '</span>'
              : status === "no" ? '<span class="chip no">' + t("chipNo") + '</span>'
              : status === "wait" ? '<span class="chip wait">' + t("chipWait") + '</span>' : "";
    tr.innerHTML = `<td class="k"></td><td class="v"></td><td class="c"></td>`;
    tr.children[0].textContent = (lang === "en" && ROWKEY_EN[k]) ? ROWKEY_EN[k] : k;
    if(v === null || v === undefined){
      tr.children[1].innerHTML = '<span class="empty">' + t("empty") + '</span> ' + chip;
    } else {
      tr.children[1].textContent = (lang === "en" && VALUE_EN[v]) ? VALUE_EN[v] : v;
      if(chip){ tr.children[1].insertAdjacentHTML("beforeend", " " + chip); }
    }
    tr.children[2].textContent = cell || (lang === "en" ? "no row" : "sin fila");
    tb.appendChild(tr);
  });

  const proof = document.getElementById("ev-proof");
  proof.innerHTML = "";
  d.quotes.forEach(q => {
    const bq = document.createElement("blockquote");
    bq.textContent = "«" + q.t + "»";
    const sp = document.createElement("span");
    sp.className = "src"; sp.textContent = (lang === "en" && q.sEn) ? q.sEn : ((lang === "es" && q.sEs) ? q.sEs : q.s);
    bq.appendChild(sp);
    proof.appendChild(bq);
  });
  loc(d, "notes").forEach(n => {
    const p = document.createElement("p");
    p.className = "paraphrase";
    p.textContent = n;
    proof.appendChild(p);
  });
  if(!d.quotes.length && !loc(d, "notes").length){
    proof.innerHTML = '<p class="paraphrase"></p>'; proof.firstChild.textContent = t("noQuote");
  }

  renderThread(d);

  const asks = document.getElementById("ev-asks");
  asks.innerHTML = "";
  loc(d, "asks").forEach(a => { const li = document.createElement("li"); li.textContent = a; asks.appendChild(li); });

  const w = document.getElementById("ev-warn");
  w.innerHTML = "";
  const s = st(current);
  if(loc(d, "warn")){
    const div = document.createElement("div");
    div.className = "block warn";
    div.innerHTML = "<h3></h3><p></p>";
    div.querySelector("h3").textContent = t("warnTitle");
    div.querySelector("p").textContent = loc(d, "warn");
    w.appendChild(div);
  }
  if(s.note){
    const div = document.createElement("div");
    div.className = "block warn";
    div.innerHTML = "<h3></h3><p></p>";
    div.querySelector("h3").textContent = t("noteTitle");
    div.querySelector("p").textContent = s.note;
    w.appendChild(div);
  }
}

function mailtoActual(){
  const d = byId(current);
  const body = document.getElementById("body").value;
  return "mailto:" + encodeURIComponent(d.to) +
    "?subject=" + encodeURIComponent(d.subject) +
    "&body=" + encodeURIComponent(body);
}

// A harder try at opening the mail client installed on the machine.
// The native anchor still fires (no preventDefault); on top of that we try
// a hidden iframe, which is not a top-level navigation and which the
// sandbox sometimes lets through. If none of it works, the launcher remains.
document.getElementById("open-app").addEventListener("click", () => {
  const url = mailtoActual();
  try {
    let f = document.getElementById("marco-mailto");
    if(!f){
      f = document.createElement("iframe");
      f.id = "marco-mailto";
      f.setAttribute("aria-hidden", "true");
      f.style.cssText = "position:absolute;width:0;height:0;border:0;left:-9999px";
      document.body.appendChild(f);
    }
    f.src = url;
  } catch(e){}
  mostrarLanzador();
});

function mostrarLanzador(){
  const box = document.getElementById("lanzador");
  box.classList.remove("hidden");
  box.innerHTML = "";
  const p = document.createElement("p");
  p.style.margin = "0";
  p.innerHTML = "<b></b> <span></span>";
  p.querySelector("b").textContent = lang === "en" ? "Did nothing open?" : "¿No se abrió nada?";
  p.querySelector("span").textContent = lang === "en"
    ? "The viewer blocks launching desktop programs. This gives you a small file: download it, double-click it, and it opens your installed Outlook with this message already filled in."
    : "El visor bloquea el lanzamiento de programas del sistema. Esto te da un archivo pequeño: lo descargas, doble clic, y abre tu Outlook instalado con este mensaje ya montado.";
  box.appendChild(p);
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = lang === "en" ? "Download launcher" : "Descargar lanzador";
  b.addEventListener("click", () => descargarLanzador(b));
  box.appendChild(b);
}

function htmlLanzador(){
  const d = byId(current);
  const url = mailtoActual();
  const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  return '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<title>Abrir en Outlook — ' + esc(d.domain) + '</title>' +
    '<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f6;color:#14181b;' +
    'display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}' +
    'main{max-width:32rem}h1{font-size:19px;margin:0 0 6px}p{color:#586870;font-size:14px;line-height:1.5}' +
    'a.b{display:inline-block;margin-top:14px;background:#1b5f7a;color:#fff;text-decoration:none;' +
    'padding:11px 20px;border-radius:8px;font-weight:600}code{font-size:12px;color:#586870}</style></head><body><main>' +
    '<h1>Abriendo Outlook…</h1>' +
    '<p>Mensaje para <strong>' + esc(d.to) + '</strong>.<br>Si tu Outlook no se abre solo, dale al botón.</p>' +
    '<a class="b" id="ir" href="' + esc(url) + '">Abrir en Outlook</a>' +
    '<p style="margin-top:22px"><code>Si el botón tampoco hace nada, tu Windows no tiene Outlook asignado como aplicación de correo. ' +
    'Configuración &rsaquo; Aplicaciones &rsaquo; Aplicaciones predeterminadas &rsaquo; Outlook &rsaquo; MAILTO.</code></p>' +
    '</main><script>setTimeout(function(){location.href=document.getElementById("ir").href;},350);<\/script></body></html>';
}

async function descargarLanzador(btn){
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = lang === "en" ? "Preparing…" : "Preparando…";
  try {
    const dl = await claude.use("downloads");
    if(!dl){
      btn.textContent = lang === "en" ? "Not available here — use Copy" : "No disponible aquí — usa Copiar";
      return;
    }
    const d = byId(current);
    await dl.save({ filename: "outlook-" + d.id + ".html", data: htmlLanzador() });
    btn.textContent = lang === "en" ? "Downloaded — double-click it" : "Descargado — dale doble clic";
  } catch(err){
    const code = err && err.code ? err.code : "";
    btn.textContent = code === "declined"
      ? (lang === "en" ? "Cancelled" : "Cancelado")
      : (lang === "en" ? "Could not save — use Copy" : "No se pudo guardar — usa Copiar");
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 4000);
  }
}

/* La tabla, construida de las fichas. Una fila por medio publicable.
   Las condiciones salen de la ficha; el precio propio del sitio, de FILAS
   cuando ese editor cobra distinto por dominio. Una celda entra en la hoja
   solo si la ficha la tiene confirmada («ok») o rechazada explícitamente
   («no»): lo que sigue en naranja es lo confirmado por correo,
   y ésas no se tocan. */
/* Una ficha puede cubrir varios dominios con precios distintos, y hasta ahora
   sólo «General» admitía valor por dominio: el resto de columnas copiaban el
   precio de la ficha en TODAS sus filas. Eso metía el precio de un sitio en la
   fila de otro, marcado como confirmado — seekingdog escribía 275 € de cripto
   en sus siete webs cuando su propio correo dice que en las de 150 € son 225.
   `celdas` permite fijar cualquier columna por dominio, y un null explícito
   significa «para este dominio no nos lo han dicho», que es distinto de cero. */
function valorCelda(d, col, fila){
  if(fila.celdas && Object.prototype.hasOwnProperty.call(fila.celdas, col)){
    const v = fila.celdas[col];
    return v === null ? {v:null, e:"wait"} : {v:v, e:"ok"};
  }
  if(col === "General" && fila.gen != null) return {v:fila.gen, e:"ok"};
  const c = d.row[col];
  if(!c) return {v:null, e:"wait"};
  return {v:c[0], e:c[1]};
}
function construirFilas(){
  const out = [];
  const cols = COLS.slice(1);   // "Dominio" va aparte
  DOMAINS.forEach(d => {
    const lista = FILAS[d.id] || [{dom:String(d.domain).split(/[ ·+(]/)[0], f:null}];
    lista.forEach(fila => {
      const c = [], changed = [];
      cols.forEach((col, i) => {
        const x = valorCelda(d, col, fila);
        const rechazo = x.e === "no";
        c.push(rechazo ? "" : (x.v == null ? "" : String(x.v)));
        if(x.e === "ok" || rechazo) changed.push(i);
      });
      out.push({record:d.id, f:fila.f, d:fila.dom, c:c, changed:changed,
                nota:fila.f ? "" : "fila por crear"});
    });
  });
  return out;
}
const CLOSED_ROWS = construirFilas();

function cellText(v){ return (v === null || v === undefined || v === "") ? "" : String(v); }

/* El vocabulario es el de la hoja original, no uno mío: se sacó leyendo
   «Latam Outreach — Simon» el 10/09. U-Z son precios (número limpio); AG, AH y
   AI son listas cerradas. Cualquier matiz —recargos sin confirmar, IVA,
   condiciones por categoría, precios distintos por dominio— va a AK. */
const NUM_COLS = ["Casino", "Cripto", "Forex", "CBD", "Dating", "General"];
const LISTA = {
  "Etiqueta":        ["", "rel=sponsored", "Image Tag", "Marked by WM"],
  "Tipo de enlace":  ["Do follow", "No follow"],
  "Permanencia":     ["permanent", "1 Year", "2 Years"]
};

function validarCeldas(){
  const out = [];
  DOMAINS.forEach(d => {
    const r = d.row || {};
    NUM_COLS.forEach(c => {
      const cell = r[c];
      if(!cell) return;
      const v = cell[0];
      if(v === null || v === undefined || v === "") return;
      if(!/^[0-9]+([.,][0-9]+)?$/.test(String(v))) out.push(d.domain.split(" ")[0] + " " + COL_LETTER[c]);
    });
    Object.keys(LISTA).forEach(c => {
      const cell = r[c];
      if(!cell || cell[1] === "wait") return;
      if(LISTA[c].indexOf(cell[0]) < 0) out.push(d.domain.split(" ")[0] + " " + COL_LETTER[c]);
    });
  });
  return out;
}

/* Un valor con tabulador o salto de línea parte la fila al pegar; uno con
   comillas puede comérselas el parser de la hoja. Hoy hay cuatro celdas de AK
   con comillas dentro y ninguna con tabuladores, pero AK se escribe a mano. */
function tsv(v){
  const s = cellText(v);
  return /[\t\n\r"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function copyTable(onlyChanged){
  /* No se copia nada mientras haya una celda fuera del vocabulario de la hoja:
     el aviso de la cabecera era sólo visual y los botones disparaban igual. */
  const rotas = validarCeldas();
  if(rotas.length){
    const el = document.getElementById("dicho-tabla");
    if(el){
      el.textContent = (lang === "en" ? "Not copied — fix these cells first: " : "No se copia — arregla antes estas casillas: ")
        + rotas.slice(0, 6).join(" · ");
      el.classList.add("on");
      setTimeout(() => el.classList.remove("on"), 6000);
    }
    return;
  }

  const lines = [];
  if(onlyChanged){
    /* ANTES: esto emitía la fila entera con las celdas no confirmadas VACÍAS.
       Pegar un hueco en una hoja no es «no tocar», es BORRAR: el botón que
       prometía tocar sólo lo necesario limpiaba las celdas que ya estaban
       bien. Ahora sale una instrucción por celda —casilla y valor— que no se
       puede pegar en bloque por accidente y dice exactamente qué escribir. */
    lines.push(lang === "en"
      ? "Cell\tDomain\tColumn\tValue to write"
      : "Casilla\tDominio\tColumna\tValor a escribir");
    CLOSED_ROWS.forEach(r => {
      if(!r.changed.length) return;
      const cols = COLS.slice(1);
      r.changed.forEach(i => {
        const col = cols[i];
        const ref = (COL_LETTER[col] || "?") + (r.f == null ? "—" : r.f);
        lines.push([ref, r.d, (lang === "en" && COLS_EN[col]) ? COLS_EN[col] : col, tsv(r.c[i])].join("\t"));
      });
    });
  } else {
    const headerRow = [t("outRow")].concat(COLS.map(c =>
      ((lang === "en" && COLS_EN[c]) ? COLS_EN[c] : c) + " (" + (COL_LETTER[c] || "") + ")"));
    lines.push(headerRow.join("\t"));
    CLOSED_ROWS.forEach(r => {
      /* Una fila sin número no existe todavía en la hoja: si sale vacía se
         cuela como si fuera la fila de arriba. Va marcada. */
      const num = r.f == null ? (lang === "en" ? "NEW" : "NUEVA") : r.f;
      lines.push([num].concat([r.d].concat(r.c).map(tsv)).join("\t"));
    });
  }
  const text = lines.join("\n");
  const say = m => {
    const el = document.getElementById("dicho-tabla");
    if(!el) return;
    el.textContent = m; el.classList.add("on");
    setTimeout(() => el.classList.remove("on"), 2400);
  };
  /* navigator.clipboard no existe fuera de contexto seguro y el acceso lanza
     de forma SÍNCRONA: sin este try el botón se quedaba muerto sin decir nada. */
  const aMano = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
    ta.remove();
    say(ok ? t("outCopiado") : t("copyManual"));
  };
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => say(t("outCopiado")), aMano);
    } else aMano();
  } catch(e){ aMano(); }
}

/* ================= refresh mail =================
   The button re-reads the Inbox of every mailbox through the viewer's own
   Outlook connector and compares what is there against the records on the
   table. It is read-only: it sends nothing and changes no record. What it
   produces is a warning, so nobody sends a draft on a thread that has
   already moved on. */

/* The mailboxes that get read. They start at two but there will be many
   more, so the list lives in the browser and is edited from the panel at
   the bottom, with no need to republish the page. "own" is the mailbox of
   whoever opens the page: that one goes without mailboxOwnerEmail. */
/* Both mailboxes are always passed explicitly via mailboxOwnerEmail.
   Using propio:true (no mailboxOwnerEmail) makes the search hit whichever
   account the connector happens to be signed in as — if that is mauro@,
   the simon@ inbox is silently skipped. Passing the address explicitly
   removes that ambiguity regardless of which account the connector uses. */
/* outreach@ entra el 11/09. Gary avisó de algo que decide esto: del buzón
   compartido sólo se captura lo que se manda USANDO outreach@; lo que salga
   desde simon@ o mauro@ no aparece ahí. O sea que los tres hacen falta, no dos
   — el día que el envío pase por outreach@, un barrido de sólo dos buzones
   diría «sin rastro» de correos que sí se mandaron, y de esa señal depende toda
   la cola. Comprobado el 11/09 con la misma llamada que hace la mesa
   (carpeta + fecha + mailboxOwnerEmail): la delegación responde. */
/* outreach@ va primero porque es a donde llega copia de todo: existe para que
   la mesa lea UN buzón en vez de perseguir uno por cada cuenta que se añada.
   Pero de ahí no sale ningún correo — todo se manda desde las cuentas
   individuales — y por eso va marcado como `agregador`.

   La marca no es decorativa. Una copia reenviada es un mensaje distinto, con
   su propio item id: el enlace «abrir en Outlook» de esa copia abre la copia,
   no el hilo. Contestar ahí saldría desde outreach@ y rompería la conversación
   original. Así que el agregador sirve para ENTERARSE de que hay respuesta, y
   el enlace se toma siempre del buzón donde el hilo vive de verdad. */
const DEFAULT_MAILBOXES = [
  {addr:"outreach@linkjuiceclub.com", propio:false, agregador:true},
  {addr:"mauro@linkjuiceclub.com", propio:false},
  {addr:"simon@linkjuiceclub.com", propio:false}
];
const MAILBOXES_KEY = "mesa-cotejo-buzones";
/* La lista guardada pisaba a la de aquí para siempre: quien ya tuviera una
   guardada nunca habría visto entrar outreach@. Es el mismo fallo que tenían
   los enlaces de Outlook. Con la huella, si yo cambio la lista de aquí, la
   guardada se descarta sola — salvo que alguien la haya tocado a mano, que es
   lo único que debe ganarme. */
const MAILBOXES_FP_KEY = "mesa-cotejo-buzones-fp";
const MAILBOXES_FP = DEFAULT_MAILBOXES.map(b => b.addr).sort().join(",");
function mailboxes(){
  try {
    const raw = localStorage.getItem(MAILBOXES_KEY);
    if(raw){
      const l = JSON.parse(raw);
      if(Array.isArray(l) && l.length){
        const lista = l.filter(x => x && typeof x.addr === "string" && x.addr.indexOf("@") > 0)
                       .map(x => {
                         const addr = x.addr.toLowerCase().trim();
                         const def = DEFAULT_MAILBOXES.find(b => b.addr === addr);
                         /* La marca de agregador vive en el código, no en lo
                            guardado: una lista vieja no la trae y sin esto
                            outreach@ volvería a comportarse como un buzón
                            normal y a secuestrar los enlaces. */
                         return {addr, propio:!!x.propio,
                                 agregador: x.agregador !== undefined ? !!x.agregador : !!(def && def.agregador)};
                       });
        const fp = localStorage.getItem(MAILBOXES_FP_KEY);
        // Editada a mano: manda ella y no se le toca nada.
        if(fp === "a-mano") return lista;
        /* Guardada por una versión anterior de la mesa: se le suman los buzones
           que yo haya añadido desde entonces, en vez de quedarse congelada. */
        DEFAULT_MAILBOXES.forEach(d => {
          if(!lista.some(x => x.addr === d.addr)) lista.push({...d});
        });
        return lista;
      }
    }
  } catch(e) {}
  return DEFAULT_MAILBOXES;
}
function saveMailboxes(lista){
  /* Una lista editada a mano SÍ debe ganarme: se marca con una huella distinta
     de la mía para que la caducidad de arriba no se la lleve por delante. */
  try {
    localStorage.setItem(MAILBOXES_KEY, JSON.stringify(lista));
    localStorage.setItem(MAILBOXES_FP_KEY, "a-mano");
  } catch(e) {}
  if(dbHandle) dbHandle.doc("config/mailboxes").set({lista, fp:"a-mano"}).catch(()=>{});
}

/* Every key a publisher can be recognised by: the record's own address,
   its aliases, and the domains of both. */
function recordKeys(d){
  const ks = {};
  const meter = raw => {
    const v = String(raw || "").toLowerCase().trim();
    if(!v) return;
    if(v.indexOf("@") >= 0){
      ks[v] = "dir";
      const dom = v.split("@")[1] || "";
      if(dom && !isFreeMailDomain(dom) && !ks[dom]) ks[dom] = "dom";
    } else if(!isFreeMailDomain(v)){
      ks[v] = "dom";
    }
  };
  meter(d.to);
  (ALIAS[d.id] || []).forEach(meter);
  return ks;
}

/* The connector can return the listing in several shapes. Every shape
   seen so far is accepted and, when none is recognised, the page says so
   instead of inventing a reading. */
function extractMessages(res){
  const esMsg = o => o && typeof o === "object" &&
    (typeof o.subject === "string" || typeof o.sender === "string") &&
    typeof o.receivedDateTime === "string";
  const cosecha = v => {
    if(Array.isArray(v)) return v.filter(esMsg);
    if(v && typeof v === "object"){
      if(esMsg(v)) return [v];
      for(const k of ["results","value","emails","messages","items","data","emailMessages"]){
        const got = cosecha(v[k]);
        if(got.length) return got;
      }
    }
    return [];
  };
  let out = cosecha(res && res.payload);
  if(out.length) return out;
  // Payload as text, or several JSON objects concatenated one after another.
  const textos = [];
  if(typeof (res && res.payload) === "string") textos.push(res.payload);
  ((res && res.content) || []).forEach(b => { if(b && b.type === "text" && typeof b.text === "string") textos.push(b.text); });
  textos.forEach(txt => {
    try {
      const got = cosecha(JSON.parse(txt));
      if(got.length){ out = out.concat(got); return; }
    } catch(e) {}
    // Concatenated objects: sliced on balanced braces.
    let prof = 0, ini = -1;
    for(let i = 0; i < txt.length; i++){
      const c = txt[i];
      if(c === "{"){ if(prof === 0) ini = i; prof++; }
      else if(c === "}"){
        prof--;
        if(prof === 0 && ini >= 0){
          try { const o = JSON.parse(txt.slice(ini, i + 1)); if(esMsg(o)) out.push(o); } catch(e) {}
          ini = -1;
        }
      }
    }
  });
  return out;
}

/* The most recent date quoted in a record, used to tell whether the mail
   that just arrived is newer than what the record already holds. */
function recordLatestDate(d){
  let max = 0;
  const mirar = s => {
    const m = /(\d{1,2})\/(\d{1,2})/.exec(String(s || ""));
    if(!m) return;
    const t2 = Date.UTC(anioDe(parseInt(m[2], 10), parseInt(m[1], 10)), parseInt(m[2], 10) - 1, parseInt(m[1], 10));
    if(t2 > max) max = t2;
  };
  (d.quotes || []).forEach(q => { mirar(q.s); mirar(q.sEs); });
  return max;
}

   de «borrador desfasado» —el más importante de la ficha— dejaría de saltar.

function anioDe(mes, dia){
