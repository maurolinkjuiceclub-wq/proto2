<style>
:root{
  --paper:#f4f6f6;
  --surface:#ffffff;
  --surface-2:#eef1f2;
  --ink:#14181b;
  --muted:#586870;
  --line:#dce2e4;
  --line-strong:#c3cdd1;
  --accent:#1b5f7a;
  --accent-ink:#124559;
  --accent-wash:#e7f0f4;
  --ok-bg:#c6efce;
  --ok-ink:#155f36;
  --ok-line:#9bd6ad;
  --wait-bg:#ffcc99;
  --wait-ink:#8a4a04;
  --wait-line:#e8b078;
  --shadow:0 1px 2px rgba(20,24,27,.06),0 8px 24px -16px rgba(20,24,27,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101418;
    --surface:#171d22;
    --surface-2:#1e252b;
    --ink:#e7ecee;
    --muted:#94a4ad;
    --line:#283138;
    --line-strong:#3a464e;
    --accent:#66b6d3;
    --accent-ink:#9ed3e6;
    --accent-wash:#16303c;
    --ok-bg:#1d4632;
    --ok-ink:#93e3b0;
    --ok-line:#2f6b4c;
    --wait-bg:#4a3218;
    --wait-ink:#f2b978;
    --wait-line:#6d4c26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{

  --surface-2:#1e252b;
  --ink:#e7ecee;
  --muted:#94a4ad;
  --line:#283138;
  --line-strong:#3a464e;
  --accent:#66b6d3;
  --accent-ink:#9ed3e6;
  --accent-wash:#16303c;
  --ok-bg:#1d4632;
  --ok-ink:#93e3b0;
  --ok-line:#2f6b4c;
  --wait-bg:#4a3218;
  --wait-ink:#f2b978;

  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:14px 22px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.bar h1{
  font-family:Newsreader,Georgia,serif;
  font-weight:600;font-size:23px;letter-spacing:-.01em;margin:0;
}
.bar .sub{color:var(--muted);font-size:13px}
.counts{margin-left:auto;display:flex;gap:16px;font-size:12.5px;color:var(--muted);align-items:baseline}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;align-self:center}
.lang button{
  background:var(--surface);border:0;padding:4px 10px;cursor:pointer;
  font-size:11.5px;letter-spacing:.06em;font-weight:600;color:var(--muted);
}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* ---------- shell ---------- */
.shell{
  display:grid;
  grid-template-columns:232px minmax(0,1.08fr) minmax(0,1fr);
  gap:0;
  height:calc(100vh - 57px);
  min-height:520px;
}
.rail,.pane{overflow-y:auto;overflow-x:hidden}
.rail{
  border-right:1px solid var(--line);
  background:var(--surface-2);
  padding:12px 10px 40px;
}
.rail-label,.pane-label{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
  margin:4px 6px 10px;
}
.dom{
  width:100%;text-align:left;cursor:pointer;
  display:block;padding:9px 10px;margin-bottom:2px;
  background:transparent;border:1px solid transparent;border-radius:6px;
  line-height:1.32;
}
.dom:hover{background:var(--surface)}
.dom[aria-current="true"]{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow)}
.dom .d-name{font-weight:500;font-size:13.5px;word-break:break-all}
.dom .d-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.dot.s-ok{background:var(--ok-ink)}
.dot.s-care{background:var(--wait-ink)}
.dot.s-no{background:var(--line-strong);box-shadow:inset 0 0 0 2px var(--surface-2)}
.dom.is-no .d-name{text-decoration:line-through;text-decoration-thickness:1px;opacity:.72}

.banner{
  display:flex;gap:9px;align-items:baseline;
  padding:9px 13px;border-radius:8px;margin-bottom:14px;
  font-size:13.5px;border:1px solid;
}
.banner b{font-weight:600}
.banner.s-ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.banner.s-care{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.banner.s-no{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
.hidden{display:none !important}

/* ---------- panes ---------- */
.pane{padding:20px 24px 60px;background:var(--paper)}
.pane.draft{border-right:1px solid var(--line);background:var(--surface)}

.field{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.field .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);width:72px;flex:none;font-weight:600}
.field .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;word-break:break-all}

.sender{display:flex;gap:6px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{
  background:var(--surface);border:0;padding:5px 11px;cursor:pointer;
  font-size:12.5px;font-family:"IBM Plex Mono",monospace;color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:500}
.hint{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin:18px 0 0}
.tab{
  background:transparent;border:1px solid transparent;border-bottom:0;
  padding:6px 13px;cursor:pointer;font-size:13px;color:var(--muted);
  border-radius:7px 7px 0 0;
}
.tab[aria-selected="true"]{
  background:var(--surface-2);border-color:var(--line);
  color:var(--ink);font-weight:500;
}
textarea#body{
  width:100%;min-height:330px;resize:vertical;
  padding:16px 18px;
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line);border-radius:0 8px 8px 8px;
  font-family:"Public Sans",sans-serif;font-size:14.5px;line-height:1.62;
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{
  border:1px solid var(--line-strong);background:var(--surface);
  padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;
  text-decoration:none;display:inline-block;color:var(--ink);
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500;text-decoration:none;display:inline-block}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface);border-color:var(--accent)}
.said{font-size:12.5px;color:var(--ok-ink);opacity:0;transition:opacity .18s}
.said.on{opacity:1}
@media (prefers-reduced-motion:reduce){.said{transition:none}}

/* ---------- evidence ---------- */
.block{
  background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow);
}
.block h3{
  font-family:Newsreader,Georgia,serif;font-weight:600;font-size:16px;
  margin:0 0 10px;letter-spacing:-.005em;
}
table.row{width:100%;border-collapse:collapse;font-size:13px}
table.row td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.row tr:last-child td{border-bottom:0}
table.row td.k{color:var(--muted);width:34%;white-space:nowrap}
table.row td.v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;word-break:break-all}
table.row td.c{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.chip{
  display:inline-block;padding:1px 7px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid;
}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.chip.wait{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--wait-line)}
.empty{color:var(--muted);font-style:italic}

blockquote{
  margin:0 0 10px;padding:9px 13px;
  border-left:3px solid var(--accent);
  background:var(--accent-wash);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.55;
  border-radius:0 6px 6px 0;
}
blockquote:last-child{margin-bottom:0}
.src{display:block;margin-top:6px;font-family:"Public Sans",sans-serif;font-size:11.5px;color:var(--muted)}
.paraphrase{font-size:13px;color:var(--muted);margin:0 0 8px;padding-left:13px;border-left:3px solid var(--line-strong)}
ul.asks{margin:0;padding-left:18px;font-size:13.5px}
ul.asks li{margin-bottom:5px}
.warn{border-color:var(--wait-line);background:linear-gradient(0deg,var(--surface),var(--surface))}
.warn h3{color:var(--wait-ink)}
.warn p{margin:0;font-size:13.5px}

@media (max-width:1040px){
  .shell{grid-template-columns:1fr;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px}
  .rail-label{display:none}
  .dom{width:auto;flex:none;min-width:160px}
  .pane.draft{border-right:0;border-bottom:1px solid var(--line)}
}
</style>

/* ---------- state ---------- */
const KEY = "mesa-cotejo-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function st(id){ return state[id] || (state[id] = {status:"pend", variant:0, sender:null, body:null, note:""}); }

let current = DOMAINS[0].id;
const byId = id => DOMAINS.find(d => d.id === id);

/* ---------- render ---------- */
function counts(){
  const sendable = DOMAINS.filter(d => d.status !== "no");
  let sent=0, redo=0;
  sendable.forEach(d => { const s = state[d.id]; if(!s) return; if(s.status==="sent") sent++; else if(s.status==="redo") redo++; });
  document.getElementById("c-sent").textContent = sent;
  document.getElementById("c-redo").textContent = redo;
  document.getElementById("c-pend").textContent = sendable.length - sent - redo;
  document.getElementById("c-no").textContent = DOMAINS.length - sendable.length;
}

function renderRail(){
  const rail = document.getElementById("rail");
  rail.querySelectorAll(".dom").forEach(n => n.remove());
  DOMAINS.forEach(d => {
    const s = st(d.id);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dom" + (d.status === "no" ? " is-no" : "");
    b.setAttribute("aria-current", d.id === current ? "true" : "false");
    const status = d.status === "no" ? t("stNo")
                 : s.status === "sent" ? t("stSent")
                 : s.status === "redo" ? t("stRedo") : t("stPend");
    b.innerHTML = `<span class="d-name"></span><span class="d-meta"><span class="dot s-${d.status}"></span><span class="st"></span></span>`;
    b.querySelector(".d-name").textContent = d.domain;
    b.querySelector(".st").textContent = status;
    b.addEventListener("click", () => { current = d.id; renderAll(); });
    rail.appendChild(b);
  });
}

function renderDraft(){
  const d = byId(current), s = st(current);
  const senderKey = s.sender || d.sender;

  const banner = document.getElementById("banner");
  banner.className = "banner s-" + d.status;
  banner.innerHTML = "<b></b>";
  banner.querySelector("b").textContent = loc(d, "statusText");

  const sendOnly = d.status === "no";
  ["open-outlook","open-app","copy","mark-sent","redo","send-hint"].forEach(idAttr => {
    document.getElementById(idAttr).classList.toggle("hidden", sendOnly);
  });

  document.getElementById("f-to").textContent = d.to;
  document.getElementById("f-subject").textContent = d.subject;
  document.getElementById("sender-note").textContent = loc(d, "senderNote");
  document.getElementById("s-mauro").setAttribute("aria-pressed", senderKey === "mauro");
  document.getElementById("s-simon").setAttribute("aria-pressed", senderKey === "simon");

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  d.variants.forEach((v, i) => {
    const t = document.createElement("button");
    t.type = "button"; t.className = "tab"; t.role = "tab";
    t.setAttribute("aria-selected", i === s.variant);
    t.textContent = v.name;
    t.addEventListener("click", () => { s.variant = i; s.body = null; save(); renderDraft(); });
    tabs.appendChild(t);
  });

  const ta = document.getElementById("body");
  ta.value = s.body !== null && s.body !== undefined ? s.body : composed(d, s, senderKey);
  syncMailto();
}

function composed(d, s, senderKey){
  const chosen = d.variants[Math.min(s.variant, d.variants.length - 1)];
  const v = (lang === "en" && chosen.textEn) ? chosen.textEn : chosen.text;
  return d.status === "no" ? v : v + "\n" + SIGN[senderKey].name;
}

function syncMailto(){
  const d = byId(current);
  const body = document.getElementById("body").value;
  const to = encodeURIComponent(d.to);
  const subject = encodeURIComponent(d.subject);
  const enc = encodeURIComponent(body);

  // Botón principal: Outlook de escritorio vía mailto. Va en pestaña nueva
  // para que el traspaso al programa de correo no deje esta página en blanco.
  document.getElementById("open-outlook").setAttribute("href",
    "mailto:" + to + "?subject=" + subject + "&body=" + enc);

  // Alternativa: Outlook en el navegador, una URL https normal.
  document.getElementById("open-app").setAttribute("href",
    "https://outlook.office.com/mail/deeplink/compose?to=" + to + "&subject=" + subject + "&body=" + enc);
}

function renderEvidence(){
  const d = byId(current);
  document.getElementById("ev-domain").textContent = d.domain + " — " + loc(d, "label");

  const tb = document.getElementById("ev-row");
  tb.innerHTML = "";
  Object.entries(d.row).forEach(([k, [v, status, cell]]) => {
    const tr = document.createElement("tr");
    const chip = status === "ok" ? '<span class="chip ok">' + t("chipOk") + '</span>'
              : status === "wait" ? '<span class="chip wait">' + t("chipWait") + '</span>' : "";
    tr.innerHTML = `<td class="k"></td><td class="v"></td><td class="c"></td>`;
    tr.children[0].textContent = (lang === "en" && ROWKEY_EN[k]) ? ROWKEY_EN[k] : k;
    if(v === null || v === undefined){
      tr.children[1].innerHTML = '<span class="empty">' + t("empty") + '</span> ' + chip;
    } else {
      tr.children[1].textContent = (lang === "en" && VALUE_EN[v]) ? VALUE_EN[v] : v;
      if(chip){ tr.children[1].insertAdjacentHTML("beforeend", " " + chip); }
    }
    tr.children[2].textContent = cell;
    tb.appendChild(tr);
  });

  const proof = document.getElementById("ev-proof");
  proof.innerHTML = "";
  d.quotes.forEach(q => {
    const bq = document.createElement("blockquote");
    bq.textContent = "«" + q.t + "»";
    const sp = document.createElement("span");
    sp.className = "src"; sp.textContent = (lang === "en" && q.sEn) ? q.sEn : ((lang === "es" && q.sEs) ? q.sEs : q.s);
    bq.appendChild(sp);
    proof.appendChild(bq);
  });
  loc(d, "notes").forEach(n => {
    const p = document.createElement("p");
    p.className = "paraphrase";
    p.textContent = n;
    proof.appendChild(p);
  });
  if(!d.quotes.length && !loc(d, "notes").length){
    proof.innerHTML = '<p class="paraphrase"></p>'; proof.firstChild.textContent = t("noQuote");
  }

  const asks = document.getElementById("ev-asks");
  asks.innerHTML = "";
  loc(d, "asks").forEach(a => { const li = document.createElement("li"); li.textContent = a; asks.appendChild(li); });

  const w = document.getElementById("ev-warn");
  w.innerHTML = "";
  const s = st(current);
  if(loc(d, "warn")){
    const div = document.createElement("div");
    div.className = "block warn";
    div.innerHTML = "<h3></h3><p></p>";
    div.querySelector("h3").textContent = t("warnTitle");
    div.querySelector("p").textContent = loc(d, "warn");
    w.appendChild(div);
  }
  if(s.note){
    const div = document.createElement("div");
    div.className = "block warn";
    div.innerHTML = "<h3></h3><p></p>";
    div.querySelector("h3").textContent = t("noteTitle");
    div.querySelector("p").textContent = s.note;
    w.appendChild(div);
  }
}

function renderChrome(){
  const set = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
  set("t-sub", t("sub"));
  set("t-pend", t("pend")); set("t-sent", t("sent")); set("t-redo", t("redo")); set("t-no", t("no"));
  set("t-queue", t("queue")); set("t-msg", t("msg")); set("t-rowlabel", t("rowLabel"));
  set("t-to", t("to")); set("t-subj", t("subj")); set("t-from", t("from"));
  set("t-proof", t("proof")); set("t-asks", t("asksTitle"));
  set("open-outlook", t("openApp")); set("open-app", t("openWeb"));
  set("copy", t("copy")); set("export", t("exportNotes"));
  set("redo", t("askRedo"));
  const s = st(current);
  set("mark-sent", s.status === "sent" ? t("markPend") : t("markSent"));
  set("send-hint", t("hint") + (t("langNote") ? " " + t("langNote") : ""));
  document.getElementById("lang-es").setAttribute("aria-pressed", lang === "es");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
}

function renderAll(){ renderRail(); renderDraft(); renderEvidence(); counts(); renderChrome(); }

["es","en"].forEach(code => {
  document.getElementById("lang-" + code).addEventListener("click", () => {
    lang = code;
    try { localStorage.setItem("mesa-cotejo-lang", code); } catch(e) {}
    renderAll();
  });
});

/* ---------- actions ---------- */
function flash(msg){
  const el = document.getElementById("said");
  el.textContent = msg; el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 2200);
}

document.getElementById("body").addEventListener("input", e => {
  const s = st(current); s.body = e.target.value; save(); syncMailto();
});
["mauro","simon"].forEach(k => {
  document.getElementById("s-" + k).addEventListener("click", () => {
    const s = st(current); s.sender = k; s.body = null; save(); renderDraft();
  });
});
document.getElementById("copy").addEventListener("click", async () => {
  const text = document.getElementById("body").value;
  try { await navigator.clipboard.writeText(text); flash(t("copied")); }
  catch(e){
    const ta = document.getElementById("body");
    ta.focus(); ta.select();
    flash(t("copyManual"));
  }
});
document.getElementById("mark-sent").addEventListener("click", () => {
  const s = st(current);
  s.status = s.status === "sent" ? "pend" : "sent";
  save(); renderAll(); flash(s.status === "sent" ? t("doneSent") : t("donePend"));
});
document.getElementById("redo").addEventListener("click", () => {
  const s = st(current);
  const note = window.prompt(t("promptRedo"), s.note || "");
  if(note === null) return;
  s.note = note.trim();
  s.status = s.note ? "redo" : "pend";
  save(); renderAll();
  flash(s.note ? t("noted") : t("noteCleared"));
});
document.getElementById("export").addEventListener("click", async () => {
  const out = DOMAINS.map(d => {
    const s = st(d.id);
    return {dominio:d.domain, estado:s.status, nota:s.note || "", version:d.variants[s.variant].name};
  });
  const text = JSON.stringify(out, null, 1);
  try { await navigator.clipboard.writeText(text); flash(t("exported")); }
  catch(e){ flash(t("exportFail")); console.log(text); }
});

renderAll();
</script>
